<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Product Details</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/main.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <div class="hero">
      <img src="public/images/banner-sm.jpg" srcset="public/images/banner-sm.jpg 500w, public/images/banner.jpg" alt="high mountain lake image">
      <div class="logo logo--square">
        <img src="public/images/noun_Tent_2517.svg" alt="image for tent logo">
        <div>Sleep <span class="highlight">Outside</span></div>
      </div>
      <div class="mission">
        <p>Our mission is to provide you with everything you need to sleep outsied confortably at an affordable price.</p>
      </div>
    </div>

    <section class="products">
      <ul class="product-grid">
        <li>
          <a href="product_listing/index.html?category=tents">
            <img src="public/images/category-tents.svg" alt="Tent 1" >
            <h2>Tents</h2>
          </a>
        </li>
        <li>
          <a href="product_listing/index.html?category=backpacks">
            <!-- <img src="public/images/category-backpacks.svg" alt="Backpacks" /> -->
            <img src="public/images/category-backpacks.svg" alt="Backpack 2">
            <h2>Backpacks</h2>
          </a>
        </li>
        <li>
          <a href="product_listing/index.html?category=sleeping-bags">
            <img src="public/images/category-sleepingbags.svg" alt="Sleeping Bags" />
            <h2>Sleeping Bags</h2>
          </a>
        </li>
        <li>
          <a href="product_listing/index.html?category=hammocks">
            <img src="public/images/category-hammocks.svg" alt="Hammocks" />
            <h2>Hammocks</h2>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
